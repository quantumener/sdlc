<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Risk &amp; Governance — Archetype Atlas</title>
<style>
:root{
  --sc-blue:#0072CE;
  --sc-blue-dark:#00427A;
  --sc-blue-deeper:#002B52;
  --sc-blue-tint:#E9F3FC;
  --sc-green:#38D200;
  --sc-green-dark:#2E9E0E;
  --sc-green-tint:#EDFAE5;
  --ink:#1D2530;
  --slate:#5B6770;
  --mist:#8C99A6;
  --line:#E1E8EF;
  --panel:#F6F9FC;
  --white:#FFFFFF;
  --high:#C8102E;
  --high-tint:#FBEBEE;
  --med:#E8A200;
  --med-tint:#FCF4E0;
  --low:#2E9E0E;
  --low-tint:#EDFAE5;
  --shadow:0 1px 2px rgba(29,37,48,.05),0 6px 18px rgba(29,37,48,.06);
  --shadow-lift:0 2px 4px rgba(0,66,122,.08),0 14px 34px rgba(0,66,122,.14);
  --radius:14px;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  font-family:Arial, Helvetica, sans-serif;
  color:var(--ink);
  background:var(--white);
  -webkit-font-smoothing:antialiased;
  line-height:1.5;
}
button{font-family:inherit}

/* ---------- Cover ---------- */
#cover{
  position:fixed;inset:0;z-index:100;
  background:linear-gradient(135deg,#0B63B4 0%,#0072CE 38%,#00427A 100%);
  color:#fff;display:flex;flex-direction:column;justify-content:center;
  padding:8vh 9vw;transition:opacity .7s ease,visibility .7s;
}
#cover.hidden{opacity:0;visibility:hidden;pointer-events:none}
#cover .eyebrow{font-size:14px;letter-spacing:.22em;text-transform:uppercase;opacity:.85;margin-bottom:26px}
#cover h1{font-size:clamp(38px,5.2vw,64px);font-weight:bold;line-height:1.12;max-width:16ch}
#cover h2{font-size:clamp(20px,2.4vw,30px);font-weight:normal;line-height:1.3;margin-top:14px;opacity:.92;max-width:34ch}
#cover .cover-meta{margin-top:44px;display:flex;gap:34px;flex-wrap:wrap}
#cover .cover-meta div{border-left:3px solid rgba(255,255,255,.55);padding-left:14px}
#cover .cover-meta b{display:block;font-size:22px}
#cover .cover-meta span{font-size:12.5px;opacity:.8;text-transform:uppercase;letter-spacing:.08em}
#enterBtn{
  margin-top:56px;align-self:flex-start;background:#fff;color:var(--sc-blue-dark);
  border:none;font-size:16px;font-weight:bold;padding:15px 34px;border-radius:999px;
  cursor:pointer;display:flex;align-items:center;gap:12px;transition:transform .2s,box-shadow .2s;
}
#enterBtn:hover{transform:translateY(-2px);box-shadow:0 12px 30px rgba(0,0,0,.25)}
#enterBtn .arr{transition:transform .2s}
#enterBtn:hover .arr{transform:translateX(4px)}
.cover-grid{
  position:absolute;right:-4vw;top:50%;transform:translateY(-50%);
  width:38vw;max-width:560px;aspect-ratio:1;opacity:.16;pointer-events:none;
}

/* ---------- App chrome ---------- */
#topbar{
  position:sticky;top:0;z-index:50;background:var(--white);
  border-bottom:1px solid var(--line);
}
#topbar .bar-inner{
  max-width:1240px;margin:0 auto;padding:0 28px;height:62px;
  display:flex;align-items:center;gap:26px;
}
.brandmark{display:flex;flex-direction:column;line-height:1.15;cursor:pointer}
.brandmark b{font-size:15px;color:var(--sc-blue-dark)}
.brandmark span{font-size:11px;color:var(--mist);letter-spacing:.14em;text-transform:uppercase}
nav.tabs{display:flex;gap:4px;margin-left:auto}
nav.tabs button{
  background:none;border:none;font-size:14px;color:var(--slate);padding:10px 14px;
  cursor:pointer;border-radius:8px;position:relative;font-weight:bold;
}
nav.tabs button:hover{background:var(--panel);color:var(--sc-blue-dark)}
nav.tabs button.active{color:var(--sc-blue)}
nav.tabs button.active::after{
  content:"";position:absolute;left:14px;right:14px;bottom:-1px;height:3px;
  background:linear-gradient(90deg,var(--sc-blue),var(--sc-green));border-radius:2px;
}
#crumbs{
  max-width:1240px;margin:0 auto;padding:16px 28px 0;font-size:13px;color:var(--mist);
  display:flex;align-items:center;gap:8px;flex-wrap:wrap;
}
#crumbs a{color:var(--sc-blue);text-decoration:none;cursor:pointer}
#crumbs a:hover{text-decoration:underline}
#crumbs .sep{color:var(--line)}
main{max-width:1240px;margin:0 auto;padding:22px 28px 90px}

.view{animation:fadeUp .45s ease both}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){
  .view,#enterBtn,.card,.uc-card{animation:none!important;transition:none!important}
}

/* ---------- Typography blocks ---------- */
.page-head{margin:26px 0 8px}
.page-head .kicker{font-size:12.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--sc-blue);font-weight:bold}
.page-head h1{font-size:clamp(28px,3.4vw,40px);font-weight:bold;line-height:1.15;margin-top:8px}
.page-head p.lede{font-size:16.5px;color:var(--slate);max-width:76ch;margin-top:12px}
.section-title{font-size:13px;letter-spacing:.18em;text-transform:uppercase;color:var(--mist);font-weight:bold;margin:42px 0 16px;display:flex;align-items:center;gap:14px}
.section-title::after{content:"";flex:1;height:1px;background:var(--line)}

/* ---------- Stat strip ---------- */
.stat-strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin:30px 0 8px}
.stat{
  background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
  padding:18px 20px;cursor:pointer;transition:transform .18s,box-shadow .18s,border-color .18s;
}
.stat:hover{transform:translateY(-2px);box-shadow:var(--shadow-lift);border-color:var(--sc-blue)}
.stat b{font-size:30px;color:var(--sc-blue-dark);display:block;line-height:1.1}
.stat span{font-size:12px;color:var(--slate);text-transform:uppercase;letter-spacing:.08em}
.stat.tier-high b{color:var(--high)} .stat.tier-med b{color:var(--med)} .stat.tier-low b{color:var(--low)}

/* ---------- Cards ---------- */
.card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(268px,1fr));gap:18px}
.card{
  background:var(--white);border:1px solid var(--line);border-radius:var(--radius);
  padding:22px;cursor:pointer;position:relative;overflow:hidden;
  transition:transform .18s ease,box-shadow .18s ease,border-color .18s;
  display:flex;flex-direction:column;gap:10px;min-height:186px;
}
.card::before{
  content:"";position:absolute;left:0;top:0;bottom:0;width:4px;
  background:linear-gradient(180deg,var(--sc-blue),var(--sc-green));
  transform:scaleY(0);transform-origin:top;transition:transform .25s ease;
}
.card:hover{transform:translateY(-3px);box-shadow:var(--shadow-lift);border-color:#BBD6F0}
.card:hover::before{transform:scaleY(1)}
.card .glyph{
  width:42px;height:42px;border-radius:11px;background:var(--sc-blue-tint);
  color:var(--sc-blue-dark);display:flex;align-items:center;justify-content:center;
  font-weight:bold;font-size:15px;letter-spacing:.02em;
}
.card h3{font-size:17px;font-weight:bold;line-height:1.28}
.card p{font-size:13.5px;color:var(--slate);flex:1}
.card .foot{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:4px}
.card .count{font-size:12px;color:var(--mist)}
.card .go{font-size:13px;color:var(--sc-blue);font-weight:bold;opacity:0;transform:translateX(-4px);transition:.2s}
.card:hover .go{opacity:1;transform:none}

/* domain cards */
.domain-card .glyph{background:var(--sc-blue-dark);color:#fff}
.domain-card{min-height:200px}

/* ---------- chips & badges ---------- */
.chip{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:bold;
  padding:4px 11px;border-radius:999px;letter-spacing:.04em;text-transform:uppercase}
.chip.high{background:var(--high-tint);color:var(--high)}
.chip.med{background:var(--med-tint);color:#9A6E00}
.chip.low{background:var(--low-tint);color:var(--low)}
.chip.neutral{background:var(--panel);color:var(--slate);text-transform:none;letter-spacing:0;font-weight:normal;font-size:12px}
.chip.pattern{background:var(--sc-blue-tint);color:var(--sc-blue-dark);text-transform:none;letter-spacing:0}
.dot{width:7px;height:7px;border-radius:50%;background:currentColor;display:inline-block}
.tag-row{display:flex;flex-wrap:wrap;gap:7px}

/* ---------- Archetype detail ---------- */
.split{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:26px;align-items:start}
@media(max-width:900px){.split{grid-template-columns:1fr}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:22px}
.panel h4{font-size:13px;text-transform:uppercase;letter-spacing:.14em;color:var(--mist);margin-bottom:14px}
.kv{display:flex;justify-content:space-between;gap:14px;padding:9px 0;border-bottom:1px dashed var(--line);font-size:13.5px}
.kv:last-child{border-bottom:none}
.kv b{color:var(--ink)} .kv span{color:var(--slate);text-align:right}

.uc-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.uc-card{
  border:1px solid var(--line);border-radius:var(--radius);padding:20px;background:#fff;
  cursor:pointer;transition:transform .18s,box-shadow .18s,border-color .18s;
  display:flex;flex-direction:column;gap:9px;
}
.uc-card:hover{transform:translateY(-3px);box-shadow:var(--shadow-lift);border-color:#BBD6F0}
.uc-card h4{font-size:15.5px;line-height:1.3}
.uc-card p{font-size:13px;color:var(--slate);flex:1}
.uc-card .tiers{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--mist)}
.uc-card .arrow-flow{font-size:13px;color:var(--mist)}

/* ---------- dimension bars ---------- */
.dims{display:flex;flex-direction:column;gap:13px}
.dim{display:grid;grid-template-columns:170px 1fr 34px;gap:12px;align-items:center;font-size:13px}
.dim label{color:var(--slate)}
.dim .track{height:9px;border-radius:6px;background:#E9EEF4;overflow:hidden}
.dim .fill{height:100%;border-radius:6px;background:linear-gradient(90deg,var(--sc-blue),var(--sc-green));
  width:0;transition:width .8s cubic-bezier(.2,.7,.2,1)}
.dim .fill.hot{background:linear-gradient(90deg,#E8A200,var(--high))}
.dim b{text-align:right;color:var(--sc-blue-dark)}

/* ---------- risk spectrum (signature) ---------- */
.spectrum{margin:18px 0 6px}
.spectrum .lane{
  position:relative;height:14px;border-radius:8px;
  background:linear-gradient(90deg,#59B94C 0%,#A9CE3B 30%,#F2C14E 55%,#E8862B 78%,#C8102E 100%);
}
.spectrum .marker{
  position:absolute;top:50%;width:26px;height:26px;border-radius:50%;
  border:4px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.28);
  transform:translate(-50%,-50%);transition:left 1.1s cubic-bezier(.3,.8,.25,1);
}
.spectrum .marker.inh{background:var(--sc-blue-dark)}
.spectrum .marker.res{background:var(--sc-green-dark)}
.spectrum .legend{display:flex;justify-content:space-between;font-size:11px;color:var(--mist);
  text-transform:uppercase;letter-spacing:.1em;margin-top:9px}
.spectrum-note{display:flex;gap:22px;font-size:12.5px;color:var(--slate);margin-top:12px}
.spectrum-note i{width:12px;height:12px;border-radius:50%;display:inline-block;margin-right:7px;vertical-align:-1px}

/* ---------- tabs ---------- */
.tabbar{display:flex;gap:6px;border-bottom:1px solid var(--line);margin:30px 0 22px;flex-wrap:wrap}
.tabbar button{
  background:none;border:none;font-size:14px;font-weight:bold;color:var(--slate);
  padding:11px 16px;cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-1px;
}
.tabbar button.active{color:var(--sc-blue);border-bottom-color:var(--sc-blue)}
.tabbar button:hover{color:var(--sc-blue-dark)}

/* ---------- lists ---------- */
.check-list{display:flex;flex-direction:column;gap:11px}
.check-list li{
  list-style:none;display:flex;gap:13px;font-size:14px;background:#fff;
  border:1px solid var(--line);border-radius:11px;padding:13px 16px;align-items:flex-start;
}
.check-list li .tick{
  flex:none;width:22px;height:22px;border-radius:50%;background:var(--sc-green-tint);
  color:var(--sc-green-dark);display:flex;align-items:center;justify-content:center;
  font-size:12px;font-weight:bold;margin-top:1px;
}
.check-list li.warn .tick{background:var(--med-tint);color:#9A6E00}
.check-list li.stop .tick{background:var(--high-tint);color:var(--high)}

/* jurisdiction grid */
.jx-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:13px}
.jx{border:1px solid var(--line);border-radius:11px;padding:15px 17px;background:#fff}
.jx b{font-size:14px;display:flex;align-items:center;gap:9px}
.jx p{font-size:12.5px;color:var(--slate);margin-top:6px}
.jx .flagbox{width:26px;height:18px;border-radius:3px;background:var(--sc-blue-tint);
  color:var(--sc-blue-dark);font-size:10px;font-weight:bold;display:flex;align-items:center;justify-content:center}

/* roadmap */
.gates{position:relative;margin:10px 0 0;padding-left:30px}
.gates::before{content:"";position:absolute;left:10px;top:8px;bottom:8px;width:2px;background:var(--line)}
.gate{position:relative;padding:0 0 26px 8px}
.gate:last-child{padding-bottom:0}
.gate::before{
  content:"";position:absolute;left:-27px;top:4px;width:16px;height:16px;border-radius:50%;
  background:#fff;border:4px solid var(--sc-blue);
}
.gate.done::before{background:var(--sc-green);border-color:var(--sc-green)}
.gate b{font-size:14.5px;display:block}
.gate span{font-size:13px;color:var(--slate)}
.gate .gtag{font-size:10.5px;font-weight:bold;letter-spacing:.1em;text-transform:uppercase;color:var(--sc-blue)}

/* ---------- rules ---------- */
.rule-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.rule{border:1px solid var(--line);border-left:5px solid var(--sc-blue);border-radius:12px;padding:19px;background:#fff}
.rule.floor{border-left-color:var(--high)}
.rule.credit{border-left-color:var(--sc-green)}
.rule b{font-size:15px;display:block;margin-bottom:6px}
.rule p{font-size:13px;color:var(--slate)}
.rule .rid{font-size:10.5px;font-weight:bold;letter-spacing:.14em;color:var(--mist);text-transform:uppercase}

/* ---------- simulator ---------- */
.sim-wrap{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:28px;align-items:start}
@media(max-width:940px){.sim-wrap{grid-template-columns:1fr}}
.sim-controls{display:flex;flex-direction:column;gap:20px}
.ctl{background:#fff;border:1px solid var(--line);border-radius:12px;padding:17px 19px}
.ctl label{font-size:13px;font-weight:bold;display:flex;justify-content:space-between;margin-bottom:11px}
.ctl label output{color:var(--sc-blue)}
.seg{display:flex;flex-wrap:wrap;gap:7px}
.seg button{
  border:1px solid var(--line);background:#fff;border-radius:999px;font-size:12.5px;
  padding:7px 14px;cursor:pointer;color:var(--slate);transition:.15s;
}
.seg button:hover{border-color:var(--sc-blue)}
.seg button.on{background:var(--sc-blue);border-color:var(--sc-blue);color:#fff;font-weight:bold}
input[type=range]{width:100%;accent-color:var(--sc-blue)}
.verdict{
  border:1px solid var(--line);border-radius:var(--radius);padding:26px;background:var(--panel);
  position:sticky;top:86px;
}
.verdict .big-tier{
  font-size:44px;font-weight:bold;letter-spacing:.01em;line-height:1;
  display:flex;align-items:center;gap:14px;margin:8px 0 4px;
}
.verdict .big-tier .pulse{width:18px;height:18px;border-radius:50%;position:relative}
.verdict .big-tier .pulse::after{
  content:"";position:absolute;inset:-7px;border-radius:50%;border:2px solid currentColor;
  opacity:.5;animation:pulse 1.8s ease-out infinite;
}
@keyframes pulse{0%{transform:scale(.6);opacity:.7}100%{transform:scale(1.4);opacity:0}}
.fired{margin-top:18px;display:flex;flex-direction:column;gap:9px}
.fired li{list-style:none;font-size:13px;background:#fff;border:1px solid var(--line);
  border-radius:10px;padding:10px 13px;display:flex;gap:10px;animation:fadeUp .35s both}
.fired li b{color:var(--sc-blue-dark)}
.score-readout{display:flex;gap:22px;margin-top:16px}
.score-readout div b{font-size:24px;display:block;color:var(--sc-blue-dark)}
.score-readout div span{font-size:11px;color:var(--mist);text-transform:uppercase;letter-spacing:.08em}

/* footer strip */
.footnote{margin-top:64px;padding-top:20px;border-top:1px solid var(--line);
  font-size:12px;color:var(--mist);display:flex;justify-content:space-between;gap:18px;flex-wrap:wrap}

/* back button */
.backlink{display:inline-flex;align-items:center;gap:8px;font-size:13.5px;color:var(--sc-blue);
  font-weight:bold;cursor:pointer;background:none;border:none;padding:6px 0;margin-top:10px}
.backlink:hover{text-decoration:underline}

::selection{background:var(--sc-blue-tint)}
</style>
</head>
<body>

<div id="cover">
  <svg class="cover-grid" viewBox="0 0 100 100" aria-hidden="true">
    <g fill="none" stroke="#fff" stroke-width=".5">
      <circle cx="50" cy="50" r="46"/><circle cx="50" cy="50" r="34"/><circle cx="50" cy="50" r="22"/>
      <path d="M4 50 H96 M50 4 V96 M17 17 L83 83 M83 17 L17 83"/>
    </g>
  </svg>
  <div class="eyebrow">AI Risk &amp; Governance · Second Line of Defence</div>
  <h1>AI Use-Case Archetype Atlas</h1>
  <h2>An interactive risk map of AI and agentic AI across the Group — from intake to deployment nod</h2>
  <div class="cover-meta">
    <div><b id="cvDomains">4</b><span>Business domains</span></div>
    <div><b id="cvArch">12</b><span>Archetypes</span></div>
    <div><b id="cvUC">36</b><span>Use cases mapped</span></div>
    <div><b id="cvRules">12</b><span>Static tiering rules</span></div>
  </div>
  <button id="enterBtn">Enter the atlas <span class="arr">→</span></button>
</div>

<div id="topbar">
  <div class="bar-inner">
    <div class="brandmark" onclick="go('home')">
      <b>AI Risk &amp; Governance</b>
      <span>Archetype Atlas</span>
    </div>
    <nav class="tabs" id="mainTabs">
      <button data-v="home">Portfolio</button>
      <button data-v="domains">Domains</button>
      <button data-v="rules">Tiering rules</button>
      <button data-v="sim">Simulator</button>
    </nav>
  </div>
</div>
<div id="crumbs"></div>
<main id="app"></main>
<script>
/* ============================================================
   DATA MODEL — AI Risk & Governance Archetype Atlas
   Tiers: High / Medium / Low. Dimensions scored 1–5.
   Dimensions: autonomy, data, impact, regulatory, opacity, reversibility
   ============================================================ */

const RULES = [
 {id:"R1", kind:"floor", name:"Agentic floor", text:"No agentic use case is ever tiered Low. Any system that plans, selects tools or acts across steps carries a Medium floor regardless of scope."},
 {id:"R2", kind:"floor", name:"Autonomy escalation", text:"Autonomy L3+ (acts first, reports later, or fully autonomous) is automatically High. No control package de-escalates below High while L3+ autonomy remains."},
 {id:"R3", kind:"floor", name:"Irreversibility floor", text:"Write access to irreversible or hard-to-unwind tools — payments, ledger postings, client communications at scale, production config — sets a High floor."},
 {id:"R4", kind:"floor", name:"Customer decisioning", text:"AI that materially influences credit, pricing, eligibility or claims outcomes for clients is High, whether retail or wholesale."},
 {id:"R5", kind:"floor", name:"Client-facing generation", text:"Generative output reaching clients without pre-release human review is at minimum Medium; unreviewed advice-like output escalates to High."},
 {id:"R6", kind:"escalate", name:"Sovereignty trigger", text:"In-scope data from localisation markets (CN, IN, KR, ID, VN) processed or stored outside the jurisdiction escalates the tier one band."},
 {id:"R7", kind:"escalate", name:"Regulated-process trigger", text:"Use inside AML/sanctions, credit, capital, or regulatory reporting processes is at minimum Medium; decisioning inside these processes is High."},
 {id:"R8", kind:"escalate", name:"Third-party opacity", text:"Vendor-embedded AI without model transparency, evaluation access, or a contractual Responsible AI clause escalates one band."},
 {id:"R9", kind:"escalate", name:"PII at scale", text:"Processing special-category data or personal data above ~100k records sets a Medium minimum and triggers mandatory DPIA/DRA."},
 {id:"R10", kind:"credit", name:"Human-in-the-loop credit", text:"Verified maker–checker with binding human sign-off before effect may reduce the residual tier by one band — never below any active floor."},
 {id:"R11", kind:"credit", name:"Containment credit", text:"Read-only tool scope, sandboxed execution, rollback and a tested kill-switch may reduce residual by one band — never below any active floor."},
 {id:"R12", kind:"credit", name:"Low-eligibility gate", text:"Only internal-only, non-decisioning use on public/internal data at autonomy L0–L1 with no regulated-process contact is eligible for Low."}
];

const DIM_LABELS = {
 autonomy:"Autonomy & agency", data:"Data sensitivity", impact:"Decision impact",
 regulatory:"Regulatory exposure", opacity:"Model opacity", reversibility:"Irreversibility"
};

const DOMAINS = [
 {id:"wrb", code:"WRB", name:"Wealth & Retail Banking",
  desc:"Client-facing retail and wealth propositions — deposits, lending, cards, investments and advisory. AI here touches real clients, real money and conduct obligations, so customer-decisioning and client-facing generation rules dominate.",
  colorNote:"Highest concentration of R4/R5 floors in the portfolio."},
 {id:"cib", code:"CIB", name:"Corporate & Institutional Banking",
  desc:"Transaction banking, financial markets, lending and capital solutions for corporates and institutions. AI concentrates in document-heavy operations, markets analytics and wholesale credit — cross-border by default, so the jurisdiction matrix works hardest here.",
  colorNote:"Sovereignty (R6) and regulated-process (R7) triggers fire most often."},
 {id:"fn", code:"FN", name:"Functions",

const TIER_ORDER = {Low:0, Medium:1, High:2};
const TIER_CLASS = {Low:"low", Medium:"med", High:"high"};
const TIER_POS = {Low:12, Medium:50, High:90};  /* % along the spectrum lane */

function allUseCases(){ return ARCHETYPES.flatMap(a=>a.useCases.map(u=>({...u, arch:a}))); }
function tierCounts(){
  const c={High:0,Medium:0,Low:0};
  allUseCases().forEach(u=>c[u.residualT]++);
  return c;
}
function ruleById(id){ return RULES.find(r=>r.id===id); }
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;"); }

/* ---------------- SIMULATOR ---------------- */
const SIM = {
  pattern:"RAG assistant", autonomy:1, data:2, exposure:0, decision:0, tools:0,
  sovereignty:false, regulated:false, opaque:false, hitl:true, contain:true
};
const SIM_OPTS = {
  pattern:["Chatbot","RAG assistant","AI workflow","Copilot","Multi-agent app","Agentic app","Embedded SaaS AI"],
  data:["Public","Internal","Confidential / PII","Client financial / special category"],
  exposure:["Internal only","Staff-assisted client contact","Direct to client"],
  decision:["No decisioning","Advisory to a human","Material influence on outcome","Automated decision"],
  tools:["Read-only","Write — reversible","Write — irreversible (payments, ledger, client comms)"]
};
const AUTONOMY_DESC=["L0 — suggests only","L1 — drafts, human executes","L2 — acts in sandbox, human approves effect","L3 — acts first, reports after","L4 — fully autonomous"];

function isAgenticPattern(p){ return ["Multi-agent app","Agentic app"].includes(p); }

function computeSim(){
  const fired=[];
  const agentic = isAgenticPattern(SIM.pattern) || SIM.autonomy>=2;
  /* base score from proxy dimensions (1-5 scale each) */
  const dims = {
    autonomy: SIM.autonomy+1,
    data: SIM.data+2 > 5 ? 5 : SIM.data+2,
    impact: SIM.decision+2 > 5 ? 5 : SIM.decision+2,
    regulatory: (SIM.regulated?4:2) + (SIM.exposure===2?1:0),
    opacity: SIM.opaque?4:3,
    reversibility: SIM.tools===2?5:(SIM.tools===1?3:1)
  };
  if(dims.regulatory>5)dims.regulatory=5;
  const avg = Object.values(dims).reduce((a,b)=>a+b,0)/6;
  let base = avg>=3.4?"High":(avg>=2.2?"Medium":"Low");
  let tier = base;
  const up = t=> t==="Low"?"Medium":"High";

  let floor = "Low";
  const setFloor = f=>{ if(TIER_ORDER[f]>TIER_ORDER[floor]) floor=f; };

  if(agentic){ fired.push(["R1","Agentic pattern or L2+ autonomy — Medium floor applies."]); setFloor("Medium"); }
  if(SIM.autonomy>=3){ fired.push(["R2","Autonomy L3+ — automatically High, no de-escalation."]); setFloor("High"); }
  if(SIM.tools===2){ fired.push(["R3","Irreversible tool access — High floor."]); setFloor("High"); }
  if(SIM.decision>=2 && SIM.exposure>=1){ fired.push(["R4","Material influence on client outcomes — High."]); setFloor("High"); }
  if(SIM.exposure===2){ fired.push(["R5","Generative output direct to client — Medium minimum."]); setFloor("Medium"); }
  if(SIM.regulated){ fired.push(["R7","Regulated process — Medium minimum"+(SIM.decision>=2?"; decisioning inside it — High.":".")]); setFloor(SIM.decision>=2?"High":"Medium"); }
  if(SIM.data>=2){ fired.push(["R9","PII at scale / sensitive data — Medium minimum, DPIA mandatory."]); setFloor("Medium"); }

  if(SIM.sovereignty){ fired.push(["R6","Localisation-market data crossing borders — escalate one band."]); tier=up(tier); }
  if(SIM.opaque){ fired.push(["R8","Third-party opacity without RAI clause — escalate one band."]); tier=up(tier); }

  if(TIER_ORDER[floor]>TIER_ORDER[tier]) tier=floor;
  const inherent = tier;

  /* credits */
  let residual = inherent;
  const down = t=> t==="High"?"Medium":"Low";
  let credits=0;
  if(SIM.hitl){ credits++; fired.push(["R10","Human-in-the-loop credit available — one band down, floors permitting."]); }
  if(SIM.contain){ credits++; fired.push(["R11","Containment credit available — one band down, floors permitting."]); }
  for(let i=0;i<Math.min(credits,1);i++){ /* max one band total */
    const candidate = down(residual);
    if(TIER_ORDER[candidate]>=TIER_ORDER[floor]) residual=candidate;
  }
  const lowOK = !agentic && SIM.exposure===0 && SIM.decision===0 && SIM.data<2 && !SIM.regulated && SIM.autonomy<=1;
  if(residual==="Low" && !lowOK){ residual="Medium"; }
  if(lowOK && residual!=="Low" && floor==="Low" && !SIM.sovereignty && !SIM.opaque){
    fired.push(["R12","Low-eligibility gate met — internal, non-decisioning, low-sensitivity, L0–L1."]);
  }
  if(TIER_ORDER[residual]<TIER_ORDER[floor]) residual=floor;

  return {inherent, residual, floor, fired, dims, agentic};
}

function renderSim(){
  crumbs([{t:"Portfolio",go:"go('home')"},{t:"Simulator"}]);
  app.innerHTML = `
  <div class="view">
    <div class="page-head">
      <div class="kicker">Interactive · the same rules, live</div>
      <h1>Tier a hypothetical use case</h1>
      <p class="lede">Configure a use case the way it would arrive at intake. The engine applies R1–R12 in order and shows exactly which rules fired. Try to build an agent that lands Low — you can't, and that's the point.</p>
    </div>
    <div class="sim-wrap" style="margin-top:26px">
      <div class="sim-controls">
        <div class="ctl">
          <label>Solution pattern</label>
          <div class="seg" id="segPattern">
            ${SIM_OPTS.pattern.map(p=>`<button data-v="${p}" class="${SIM.pattern===p?'on':''}">${p}</button>`).join("")}
          </div>
        </div>
        <div class="ctl">
          <label>Autonomy level <output id="autOut">${AUTONOMY_DESC[SIM.autonomy]}</output></label>
          <input type="range" min="0" max="4" step="1" value="${SIM.autonomy}" id="autRange">
        </div>
        <div class="ctl">
          <label>Data classification</label>
          <div class="seg" id="segData">${SIM_OPTS.data.map((p,i)=>`<button data-v="${i}" class="${SIM.data===i?'on':''}">${p}</button>`).join("")}</div>
        </div>
        <div class="ctl">
          <label>Client exposure</label>
          <div class="seg" id="segExp">${SIM_OPTS.exposure.map((p,i)=>`<button data-v="${i}" class="${SIM.exposure===i?'on':''}">${p}</button>`).join("")}</div>
        </div>
        <div class="ctl">
          <label>Decisioning role</label>
          <div class="seg" id="segDec">${SIM_OPTS.decision.map((p,i)=>`<button data-v="${i}" class="${SIM.decision===i?'on':''}">${p}</button>`).join("")}</div>
        </div>
        <div class="ctl">
          <label>Tool access</label>
          <div class="seg" id="segTools">${SIM_OPTS.tools.map((p,i)=>`<button data-v="${i}" class="${SIM.tools===i?'on':''}">${p}</button>`).join("")}</div>
        </div>
        <div class="ctl">
          <label>Context & controls</label>
          <div class="seg" id="segFlags">
            <button data-f="sovereignty" class="${SIM.sovereignty?'on':''}">Localisation-market data crosses border</button>
            <button data-f="regulated" class="${SIM.regulated?'on':''}">Inside regulated process (AML / credit / reg reporting)</button>
            <button data-f="opaque" class="${SIM.opaque?'on':''}">Third-party AI, no RAI clause</button>
            <button data-f="hitl" class="${SIM.hitl?'on':''}">Human-in-the-loop sign-off</button>
            <button data-f="contain" class="${SIM.contain?'on':''}">Containment: read-only · sandbox · kill-switch</button>
          </div>
        </div>
      </div>
      <div class="verdict" id="verdict"></div>
    </div>
  </div>`;

  document.getElementById("segPattern").addEventListener("click",e=>{
    if(e.target.dataset.v!==undefined){SIM.pattern=e.target.dataset.v;refreshSeg("segPattern",SIM.pattern);updateVerdict();}
  });
  const autR=document.getElementById("autRange");
  autR.addEventListener("input",()=>{SIM.autonomy=+autR.value;document.getElementById("autOut").textContent=AUTONOMY_DESC[SIM.autonomy];updateVerdict();});
  [["segData","data"],["segExp","exposure"],["segDec","decision"],["segTools","tools"]].forEach(([id,key])=>{
    document.getElementById(id).addEventListener("click",e=>{
      if(e.target.dataset.v!==undefined){SIM[key]=+e.target.dataset.v;refreshSeg(id,String(SIM[key]));updateVerdict();}
    });
  });
  document.getElementById("segFlags").addEventListener("click",e=>{
    const f=e.target.dataset.f;
    if(f){SIM[f]=!SIM[f];e.target.classList.toggle("on",SIM[f]);updateVerdict();}
  });
  updateVerdict();
}
function refreshSeg(id,val){
  document.querySelectorAll(`#${id} button`).forEach(b=>b.classList.toggle("on",b.dataset.v===val));
}
function updateVerdict(){
  const r = computeSim();
  const color = r.residual==="High"?"var(--high)":(r.residual==="Medium"?"var(--med)":"var(--low)");
  const v = document.getElementById("verdict");
  v.innerHTML = `
    <h4 style="font-size:13px;text-transform:uppercase;letter-spacing:.14em;color:var(--mist)">Engine verdict</h4>
    <div class="big-tier" style="color:${color}">
      <span class="pulse" style="background:${color}"></span>${r.residual}
    </div>
    <div style="font-size:13px;color:var(--slate)">Residual tier · inherent ${r.inherent} · floor ${r.floor}${r.agentic?" · treated as agentic":""}</div>
    <div class="spectrum" style="margin-top:20px">
      <div class="lane">
        <div class="marker inh" style="left:${TIER_POS[r.inherent]}%"></div>
        <div class="marker res" style="left:${TIER_POS[r.residual]}%"></div>
      </div>
      <div class="legend"><span>Low</span><span>Medium</span><span>High</span></div>
    </div>
    <div class="score-readout">
      <div><b>${Object.values(r.dims).reduce((a,b)=>a+b,0)}</b><span>Dimension points / 30</span></div>
      <div><b>${r.fired.length}</b><span>Rules fired</span></div>
    </div>
    <ul class="fired">
      ${r.fired.map(([id,txt],i)=>`<li style="animation-delay:${i*60}ms"><b>${id}</b><span>${txt}</span></li>`).join("")}
      ${r.fired.length===0?'<li><b>—</b><span>No floors or escalators fired. Base scoring alone sets the tier.</span></li>':''}
    </ul>`;
}
